# Opt-in `@claude` assistant for issues and PRs.
#
# Safe for a public repository:
#   - Only the owner, org members and collaborators can trigger it (author_association check).
#     Anyone else mentioning @claude is ignored, so strangers can't spend your token or steer the agent.
#   - Runs with the minimum permissions it needs, with a timeout, and one run at a time per issue/PR.
#   - Never prints the agent's full output to the (public) Actions log.
#   - Tools are limited to the git/gh commands listed below.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) || (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) || (
        github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so merging the base branch can find a common ancestor

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Only trusted users (checked above) can reach this step; do not let the action
          # run for users without write access.
          # No rebase or force-push: conflicts are resolved with a merge commit.
          claude_args: |
            --allowedTools "Bash(git fetch:*),Bash(git merge:*),Bash(git merge-base:*),Bash(git checkout:*),Bash(git branch:*),Bash(git show:*),Bash(gh issue:*),Bash(gh pr:*),Bash(gh label:*),Bash(gh search:*),Bash(gh run view:*),Bash(gh run list:*)"
